# 1688 MCP 服务配置。
# 环境变量 PORT / HEADLESS 优先级高于本文件。
port: "18080"
headless: false
user_data_dir: ./user_data

timeouts:
  result_wait: 20    # 等待搜索结果出现（秒）
  captcha_wait: 60   # 风控验证/登录页的人工等待（秒）
  page_timeout: 90   # 单页操作超时上限（秒）
  detail_interval: 30 # 相邻两次商品详情抓取的最小间隔（秒，防风控限速）。风控严可调大（如 60），风控松可调小（如 10）
